<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge table 02</title>
</head>
<body>

    <table border="3">

<tr>
    <th rowspan="2">ID</th>
    <th rowspan="2">Subject</th>
    <th rowspan="2">Name</th>
    <th colspan="3">Mark</th>
</tr>


<tr>
    <th colspan="2">Written</th>
    <th>EVD</th>
</tr>

<tr>
    <td>1</td>
    <td></td>
    <td></td>
    <td colspan="2"></td>
    <td></td>
</tr>

<tr>
    <td rowspan="2">2</td>
    <td rowspan="2"></td>
    <td></td>
    <td colspan="2" rowspan="2"></td>
    <td rowspan="2"></td>
</tr>

<tr>
    <td></td>
</tr>

<tr>
    <td>3</td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
    <td></td>
</tr>

    </table>
    
</body>
</html>
